# Default values for agents-sandbox-controller.
# This is a YAML-formatted file.

replicaCount: 2

image:
  # Registry prepended to every image configured in this chart. An image that
  # sets its own registry overrides this one, and an empty registry inherits it.
  # The prefix is skipped for a repository whose first path segment already
  # names a host, so myreg.io/openkruise/commit-job still works as-is.
  registry: docker.io
  repository: openkruise/agent-sandbox-controller
  pullPolicy: IfNotPresent
  tag: v0.3.0

# Webhook configuration
webhook:
  port: 9443

# Metrics configuration
metrics:
  # Port the controller binds for the Prometheus /metrics endpoint.
  # Served over HTTPS with authn/authz delegation to kube-apiserver
  # (controller-runtime's --metrics-secure=true default).
  port: 8443
  rbac:
    # Create a ClusterRole that grants `get` on the /metrics nonResourceURL.
    # Bind it to your Prometheus / ARMS scraper ServiceAccount to allow
    # scraping the HTTPS endpoint. Disable if you manage metrics RBAC
    # outside this chart.
    create: true

# Health probe configuration
healthProbe:
  port: 8081

# Controller runtime configuration
controller:
  # Number of concurrent workers for each reconciler
  workers:
    sandboxWorkers: 200
    sandboxsetWorkers: 10
    sandboxclaimWorkers: 200
    sandboxupdateopsWorkers: 5
    poolautoscalerWorkers: 3
    commitWorkers: 5
  # Kubernetes API client rate limit
  clientQPS: 30000
  clientBurst: 60000

resources:
  limits:
    cpu: "2"
    memory: 4Gi
  requests:
    cpu: "2"
    memory: 4Gi

# Namespace configuration
namespace:
  name: sandbox-system

# ServiceAccount configuration
serviceAccount:
  create: true
  automount: true
  annotations: { }
  name: ""

# RBAC configuration
rbac:
  create: true

imagePullSecrets: [ ]
nameOverride: ""
fullnameOverride: ""

podAnnotations: { }
podLabels: { }

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
    add:
      - NET_BIND_SERVICE
  readOnlyRootFilesystem: true

nodeSelector: { }

tolerations: [ ]

affinity: { }

# Agent runtime injection configuration.
# Used by the `agent-runtime` entry of the sandbox-injection-config ConfigMap,
# which is injected when a Sandbox declares the `agent-runtime` runtime.
agentRuntime:
  image:
    repository: openkruise/agent-runtime
    tag: v0.2.0
    pullPolicy: IfNotPresent

# Image used by the Job pods the controller creates for Commit CRs.
# Rendered into the controller's AGENT_JOB_IMAGE environment variable.
commitJob:
  image:
    repository: openkruise/commit-job
    tag: v0.3.0

