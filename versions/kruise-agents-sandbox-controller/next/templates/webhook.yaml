{{- define "sandbox-controller.mutatingWebhooks" -}}
- admissionReviewVersions:
    - v1
    - v1beta1
  clientConfig:
    service:
      name: sandbox-controller-manager-webhook-service
      namespace: {{ include "sandbox-controller.namespace" . }}
      path: /default-sandboxset
  failurePolicy: Fail
  name: md-sbs.kb.io
  rules:
    - apiGroups:
        - agents.kruise.io
      apiVersions:
        - v1alpha1
      operations:
        - CREATE
        - UPDATE
      resources:
        - sandboxsets
  sideEffects: None
- admissionReviewVersions:
    - v1
    - v1beta1
  clientConfig:
    service:
      name: sandbox-controller-manager-webhook-service
      namespace: {{ include "sandbox-controller.namespace" . }}
      path: /default-sandboxtemplate
  failurePolicy: Fail
  name: md-sbt.kb.io
  rules:
    - apiGroups:
        - agents.kruise.io
      apiVersions:
        - v1alpha1
      operations:
        - CREATE
      resources:
        - sandboxtemplates
  sideEffects: None
{{- end }}

{{- define "sandbox-controller.validatingWebhooks" -}}
- admissionReviewVersions:
    - v1
    - v1beta1
  clientConfig:
    service:
      name: sandbox-controller-manager-webhook-service
      namespace: {{ include "sandbox-controller.namespace" . }}
      path: /validate-sandboxset
  failurePolicy: Fail
  name: v-sbs.kb.io
  rules:
    - apiGroups:
        - agents.kruise.io
      apiVersions:
        - v1alpha1
      operations:
        - CREATE
        - UPDATE
      resources:
        - sandboxsets
  sideEffects: None
- admissionReviewVersions:
    - v1
    - v1beta1
  clientConfig:
    service:
      name: sandbox-controller-manager-webhook-service
      namespace: {{ include "sandbox-controller.namespace" . }}
      path: /validate-sandboxtemplate
  failurePolicy: Ignore
  name: v-sbt.kb.io
  rules:
    - apiGroups:
        - agents.kruise.io
      apiVersions:
        - v1alpha1
      operations:
        - CREATE
      resources:
        - sandboxtemplates
  sideEffects: None
- admissionReviewVersions:
    - v1
    - v1beta1
  clientConfig:
    service:
      name: sandbox-controller-manager-webhook-service
      namespace: {{ include "sandbox-controller.namespace" . }}
      path: /validate-pod-delete
  failurePolicy: Ignore
  name: v-pod-delete.kb.io
  objectSelector:
    matchExpressions:
      - key: agents.kruise.io/created-by
        operator: In
        values:
          - sandbox
  rules:
    - apiGroups:
        - ""
      apiVersions:
        - v1
      operations:
        - DELETE
      resources:
        - pods
  sideEffects: None
- admissionReviewVersions:
    - v1
    - v1beta1
  clientConfig:
    service:
      name: sandbox-controller-manager-webhook-service
      namespace: {{ include "sandbox-controller.namespace" . }}
      path: /validate-pod-delete
  failurePolicy: Ignore
  name: v-pod-eviction.kb.io
  rules:
    - apiGroups:
        - ""
      apiVersions:
        - v1
      operations:
        - CREATE
      resources:
        - pods/eviction
  sideEffects: None
- admissionReviewVersions:
    - v1
    - v1beta1
  clientConfig:
    service:
      name: sandbox-controller-manager-webhook-service
      namespace: {{ include "sandbox-controller.namespace" . }}
      path: /validate-sandboxupdateops
  failurePolicy: Fail
  name: v-suo.kb.io
  rules:
    - apiGroups:
        - agents.kruise.io
      apiVersions:
        - v1alpha1
      operations:
        - CREATE
        - UPDATE
      resources:
        - sandboxupdateops
  sideEffects: None
- admissionReviewVersions:
    - v1
    - v1beta1
  clientConfig:
    service:
      name: sandbox-controller-manager-webhook-service
      namespace: {{ include "sandbox-controller.namespace" . }}
      path: /validate-poolautoscaler
  failurePolicy: Fail
  name: v-pa.kb.io
  rules:
    - apiGroups:
        - agents.kruise.io
      apiVersions:
        - v1alpha1
      operations:
        - CREATE
        - UPDATE
      resources:
        - poolautoscalers
  sideEffects: None
{{- end }}

{{- $mutatingWebhooks := include "sandbox-controller.mutatingWebhooks" . -}}
{{- $mutatingTemplate := $mutatingWebhooks | fromYamlArray | toJson -}}
{{- $validatingWebhooks := include "sandbox-controller.validatingWebhooks" . -}}
{{- $validatingTemplate := $validatingWebhooks | fromYamlArray | toJson -}}
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  annotations:
    agents.kruise.io/webhook-template: {{ $mutatingTemplate | quote }}
    agents.kruise.io/webhook-template-revision: {{ $mutatingTemplate | sha256sum | quote }}
  name: sandbox-controller-mutating-webhook-configuration
webhooks:
{{ $mutatingWebhooks | nindent 2 }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  annotations:
    agents.kruise.io/webhook-template: {{ $validatingTemplate | quote }}
    agents.kruise.io/webhook-template-revision: {{ $validatingTemplate | sha256sum | quote }}
  name: sandbox-controller-validating-webhook-configuration
webhooks:
{{ $validatingWebhooks | nindent 2 }}
