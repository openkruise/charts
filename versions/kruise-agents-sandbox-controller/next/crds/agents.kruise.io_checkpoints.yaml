---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: checkpoints.agents.kruise.io
spec:
  group: agents.kruise.io
  names:
    kind: Checkpoint
    listKind: CheckpointList
    plural: checkpoints
    shortNames:
    - cp
    singular: checkpoint
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Status
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Checkpoint is the Schema for the Checkpoints API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Checkpoint
            properties:
              keepRunning:
                description: |-
                  KeepRunning indicates whether the pod remains in the Running state after passing the checkpoint.
                  Default is true.
                type: boolean
              persistentContents:
                description: 'PersistentContents indicates resume pod with persistent
                  content, Enum: podInfo, memory, filesystem'
                items:
                  type: string
                type: array
                x-kubernetes-list-type: atomic
              podName:
                description: PodName is checkpoint podName.
                type: string
              repository:
                description: Repository is checkpoint repository.
                properties:
                  authSecret:
                    description: PushSecret is a reference to secret in the same namespace
                      to use for pushing Template.
                    properties:
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                    type: object
                    x-kubernetes-map-type: atomic
                  distributed:
                    default: true
                    description: |-
                      Distributed indicates whether the template is uploaded to remote repository

                      NOTE(current-implementation): In the initial phase, all Templates are considered
                      distributed (i.e., this field will default to true, see the marker below).
                      This state will change once we implement cluster-side metadata management
                      capabilities for Templates, allowing for non-distributed(pending upload or creation) states.
                    type: boolean
                  repository:
                    description: Name defines the name of the template repository
                    type: string
                  type:
                    description: Type defines the type of the template repository
                    type: string
                required:
                - repository
                - type
                type: object
              sandboxName:
                description: SandboxName is checkpoint sandboxName.
                type: string
              ttlAfterFinished:
                description: 'valid format: 30s, 30m, 30d'
                type: string
            type: object
          status:
            description: status defines the observed state of Checkpoint
            properties:
              checkpointId:
                description: checkpoint-id
                type: string
              completionTime:
                description: CompletionTime is checkpoint completed time, and phase
                  is Succeeded or Failed.
                format: date-time
                type: string
              message:
                description: message
                type: string
              observedGeneration:
                description: |-
                  observedGeneration is the most recent generation observed for this Checkpoint. It corresponds to the
                  Checkpoint's generation, which is updated on mutation by the API Server.
                format: int64
                type: integer
              phase:
                description: Checkpoint Phase
                type: string
              podTemplateDelta:
                description: |-
                  PodTemplateDelta stores a Strategic Merge Patch that captures the delta between
                  the running Pod at pause time and the base Pod generated from sandbox.spec.template
                x-kubernetes-preserve-unknown-fields: true
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
