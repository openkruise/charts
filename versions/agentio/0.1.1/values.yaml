global:
  # -- Namespace where Agentio control-plane resources are installed.
  namespace: agentio-system
  # -- Create the Agentio control-plane namespace and retain it on uninstall.
  createNamespace: true
  hub: docker.io/openkruise
  trustDomain: cluster.local
  clusterId: 'Kubernetes'
  # -- CA certificate ConfigMap name. Shared by sidecar injector and ztunnel DaemonSet.
  caCertConfigMap: agentio-ca-certs
  # -- Mesh-internal traffic policy for sandbox tunnel proxies.
  # PEER_AWARE: full peer identity matching for mTLS and policy enforcement.
  # PASSTHROUGH: skip upstream discovery for in-cluster destinations.
  meshInternalTrafficPolicy: PASSTHROUGH
  # -- When true, ztunnel (both sidecar and node-level) gets NET_ADMIN + root
  # to manage iptables/nftables firewall rules.
  enableFirewallRules: true
  # -- Use the ClusterTrustBundle API instead of a ConfigMap to distribute the
  # root cert. Requires the ClusterTrustBundle API enabled in the cluster. When
  # true, agentiod publishes a ClusterTrustBundle and both injected sidecars and
  # the node-level ztunnel mount it; when false they mount the caCertConfigMap.
  enableClusterTrustBundle: false
  # -- Single identifier shared by MESH_CONFIG_MAP_NAME, INJECTOR_CONFIG_MAP_NAME,
  # LEADER_ELECTION_PREFIX, INJECTION_WEBHOOK_CONFIG_NAME and the matching ConfigMap /
  # MutatingWebhookConfiguration names. Change in one place; all references follow.
  resourcePrefix: agentio
ztunnel:
  image:
    hub: ""
    name: ztunnel
    tag: 0.1.1
sidecarInjector:
  enabled: true
  ztunnel:
    # -- Firewall implementation used by injected per-pod ztunnels: auto or iptables.
    firewallBackend: auto
agentiod:
  replicas: 1
  env: {}
  krtEventDistributeDebounce: "200ms"
  krtEventDistributeDebounceMax: "10s"
  enableTlsTermination: true
  onDemandCertSignMode: "SELF_SIGN"
  # -- Optional. When set, sets pilot RESTRICTED_SECRETS_SCOPE; when empty,
  # the env var is omitted and pilot uses its built-in default.
  restrictedSecretsScope: true
  autoscaling:
    # -- Set to false to skip rendering the HPA. When true, `replicas` above is ignored.
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
  image:
    hub: ""
    name: pilot
    tag: 0.1.1
  # CPU request must equal limit so HPA-based utilization is meaningful.
  resources:
    requests:
      cpu: "4"
      memory: 4Gi
    limits:
      cpu: "4"
      memory: 4Gi
  # -- Node selector for control plane pods.
  nodeSelector: {}
  # -- Tolerations for control plane pods.
  tolerations: []
  # -- Affinity rules for control plane pods.
  affinity: {}
proxy:
  image:
    hub: ""
    name: proxyv2
    tag: 0.1.1
# -- Settings shared by native policy runtimes referenced by Workload discovery.
policyRuntime:
  # -- Time an existing ready workload may keep its last-known-good policy snapshot
  # while policy and Workload-reference updates converge after references become
  # temporarily unresolved. Must exceed the
  # control plane's worst-case gap between the two pushes, which is bounded by
  # PILOT_DEBOUNCE_MAX (10s by default); a shorter value lets the grace period
  # expire first and fails the workload closed. Recovery cancels the wait as
  # soon as the streams converge, so this is an upper bound, not a fixed delay.
  referenceResolutionGracePeriod: 15s
# -- Opt-in ClientHello SNI enforcement for sandbox egress gateways.
sniTrafficPolicy:
  enabled: false
# -- Lightweight image used only by the istio-init/istio-validation containers
# to configure pod iptables. It contains pilot-agent and iptables/nftables, but
# does not contain Envoy.
proxyInit:
  image:
    hub: ""
    name: proxy-init
    tag: 0.1.1
epe:
  enabled: false
  name: agentio-epe
  port: 9002
  env: {}
  # -- Replica count when autoscaling.enabled is false. Ignored when HPA is enabled.
  replicas: 1
  # -- Credential-provider client configuration.
  credentialProvider:
    # -- Base URL of the credential provider API. Rendered as the
    # IDENTITY_PROVIDER_URL environment variable — that name predates the
    # credential-provider naming and is kept for compatibility with non-chart
    # deployments. Every credential lookup fails while this is empty.
    url: ""
    # -- Where EPE's mTLS material for the credential provider comes from.
    # Exactly one source is used; there is no fallback between them. Material
    # that is absent or unusable means no client certificate is presented and
    # the provider is verified against the system trust store — a degraded
    # mode, not a startup failure. The chosen source is watched, so material
    # appearing or rotating later takes effect without a restart.
    mtls:
      # -- One of: files, secret, none.
      source: files
      # -- source=files only. Secret mounted read-only at
      # /etc/epe/credential-provider, read as client.crt/client.key/ca.crt.
      # The chart does NOT create this Secret; the mount is optional so it may
      # appear afterwards. Empty means <epe.name>-mtls-client-cert.
      secretName: ""
      # -- source=secret only. The Secret EPE watches through the API server,
      # same three data keys. Both fields are required when source=secret and
      # rendering fails if either is missing; they may also come from epe.env.
      secret:
        namespace: ""
        name: ""
      # -- DANGER: disables verification of the credential provider's server
      # certificate while still presenting the client certificate. Any on-path
      # attacker can then read the sandbox bearer token and forge the
      # credential response. Trusted test environments only.
      insecureSkipVerify: false
  autoscaling:
    # -- Set to false to skip rendering the HPA.
    enabled: false
    minReplicas: 2
    maxReplicas: 50
    targetCPUUtilizationPercentage: 80
  # CPU request must equal limit so HPA-based utilization is meaningful.
  resources:
    requests:
      cpu: 2
      memory: 2Gi
    limits:
      cpu: 2
      memory: 2Gi
  image:
    hub: "docker.io/openkruise"
    name: agentio-epe
    tag: 0.1.1
  # -- PDB minAvailable for the EPE Deployment.
  pdbMinAvailable: 1
  # -- Node selector for EPE pods.
  nodeSelector: {}
  # -- Tolerations for EPE pods.
  tolerations: []
  # -- Affinity rules for EPE pods.
  affinity: {}
# -- Egress policies applied to agent traffic. Empty by default.
egressPolicies: []
# -- Statically chart-provisioned egress gateways — the alternative to creating
# a Kubernetes Gateway and letting the controller provision it. Both approaches
# produce workloads labeled networking.agents.kruise.io/sandbox-egress=true, so
# the control plane treats them identically; use whichever fits (or both).
# Per-gateway policy (tlsTermination, extProc, ...) is still matched from the
# agentio-config EgressGateways list by name/namespace.
egressGateway:
  image:
    hub: ""
    name: proxyv2
    tag: 0.1.1
  # -- Default replicas when a gateway's autoscaling is disabled.
  replicas: 2
  # -- Default resources per gateway (overridable per gateway).
  resources:
    requests:
      cpu: "2"
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 1Gi
  # -- Default autoscaling for every gateway (overridable per gateway).
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
  pdbMinAvailable: 1
  terminationGracePeriodSeconds: 30
  # -- Optional Envoy stats flush/eviction intervals (empty = Istio defaults).
  statsFlushInterval: ""
  statsEvictionInterval: ""
  # -- Extra env injected into every gateway proxy container.
  env: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # -- Default static service entries for all gateways. A gateway may replace
  # the complete list with gateways[].serviceEntries, including an empty list.
  serviceEntries: []
  # -- One entry per egress gateway. Minimal form: [{ name: my-egress }].
  # Each entry may override: labels, replicas, resources, autoscaling,
  # nodeSelector, tolerations, affinity, pdbMinAvailable,
  # terminationGracePeriodSeconds, statsFlushInterval, statsEvictionInterval,
  # serviceEntries.
  # Example:
  # gateways:
  #   - name: egress-gateway
  #     serviceEntries:
  #       - hosts:
  #           - bff-cn-beijing.data.aliyun-inc.com
  #         endpoints:
  #           - address: 10.10.20.30
  #           - address: 10.10.20.31
  gateways: []
# -- Ambient mode. When enabled, deploys a node-level CNI DaemonSet and ztunnel
# DaemonSet for ambient mesh. Independent of sidecarInjector — both can be
# enabled simultaneously if needed.
ambient:
  # -- Set true to deploy the CNI + ztunnel DaemonSets.
  enabled: false
  cni:
    image:
      hub: ""
      name: install-cni
      tag: 0.1.1
    # -- Host paths for CNI binary and config installation
    cniBinDir: /opt/cni/bin
    cniConfDir: /etc/cni/net.d
    cniConfFileName: ""
    cniNetnsDir: /var/run/netns
    # -- Run install-cni in the host network namespace (hostNetwork + host DNS).
    # Upstream default is false; only enable if your ambient setup requires
    # sharing the host netns.
    shareHostNetworkNamespace: false
    # -- Deploy as chained CNI plugin (true) or standalone (false)
    chained: true
    # -- Namespaces excluded from CNI ambient redirection
    excludeNamespaces:
      - kube-system
    # -- Enablement selector for ambient mode. Pods/namespaces matching
    # these selectors will be enrolled into the ambient mesh.
    enablementSelector:
      # Pod-level: enrolled when the pod itself carries the label
      - podSelector:
          matchLabels:
            istio.io/dataplane-mode: ambient
      # Namespace-level: namespace has the label and the pod has not explicitly opted out
      - podSelector:
          matchExpressions:
            - key: istio.io/dataplane-mode
              operator: NotIn
              values: [none]
        namespaceSelector:
          matchLabels:
            istio.io/dataplane-mode: ambient
    # -- DNS capture for ambient pods
    dnsCapture: true
    # -- IPv6 support
    ipv6: true
    # -- Reconcile iptables rules at startup
    reconcileIptablesOnStartup: true
    # -- Pod repair settings
    repair:
      enabled: true
      repairPods: true
      labelPods: false
      deletePods: false
      initContainerName: "istio-validation"
      brokenPodLabelKey: "cni.istio.io/uninitialized"
      brokenPodLabelValue: "true"
    resources:
      requests:
        cpu: 100m
        memory: 100Mi
    tolerations:
      - effect: NoSchedule
        operator: Exists
      - key: CriticalAddonsOnly
        operator: Exists
      - effect: NoExecute
        operator: Exists
    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 1
    terminationGracePeriodSeconds: 30
  ztunnel:
    logLevel: info
    # -- Output ztunnel logs in JSON format.
    logAsJson: true
    # -- Extra environment variables as key-value pairs injected into the ztunnel container.
    env: {}
    resources:
      requests:
        cpu: 1
        memory: 1024Mi
    tolerations:
      - effect: NoSchedule
        operator: Exists
      - key: CriticalAddonsOnly
        operator: Exists
      - effect: NoExecute
        operator: Exists
    terminationGracePeriodSeconds: 30
    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 1
        maxUnavailable: 0
# -- Raw overrides merged on top of the built-in agentio-config ConfigMap body.
# Use this to set fields the chart does not model explicitly (e.g. clusterSettings)
# or to override defaults. Maps deep-merge; lists are replaced wholesale.
agentioConfig: {}
