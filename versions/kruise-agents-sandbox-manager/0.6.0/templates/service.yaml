apiVersion: v1
kind: Service
metadata:
  name: sandbox-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sandbox-manager.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: manager
      port: 8080
      protocol: TCP
      targetPort: 8080
  selector:
    {{- include "sandbox-manager.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sandbox-gateway.labels" . | nindent 4 }}
    {{- with .Values.gateway.service.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.gateway.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.gateway.service.type }}
  ports:
    - port: {{ .Values.gateway.service.port }}
      targetPort: {{ .Values.gateway.service.targetPort }}
      protocol: TCP
      name: http
    {{- if .Values.gateway.envoy.prometheus.enabled }}
    - port: {{ .Values.gateway.envoy.prometheus.port }}
      targetPort: {{ .Values.gateway.envoy.prometheus.port }}
      protocol: TCP
      name: metrics
    {{- end }}
  selector:
    {{- include "sandbox-gateway.selectorLabels" . | nindent 4 }}