{{/* Code generated by agentio-chart-sync. DO NOT EDIT. */}}
{{- if .Values.agentio.enabled }}
{{- if eq .Values.agentio.egressGateway.mode "static" }}
{{- if .Values.agentio.egressGateway.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agentio.gateway.fullname" . }}
  namespace: {{ (include "agentio.namespace" .) }}
spec:
  podSelector:
    matchLabels:
      {{- include "agentio.gateway.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: {{ .Values.agentio.egressGateway.service.ports.mesh }}
        - port: {{ .Values.agentio.egressGateway.service.ports.status }}
        - port: 15020
        - port: 15090
{{- end }}
{{- end }}
{{- end }}
