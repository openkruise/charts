{{/* Code generated by agentio-chart-sync. DO NOT EDIT. */}}
{{- if .Values.agentio.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentio.agentiod.fullname" . }}
  namespace: {{ (include "agentio.namespace" .) }}
  labels:
    {{- include "agentio.agentiod.labels" . | nindent 4 }}
spec:
  {{- if not .Values.agentio.agentiod.autoscaling.enabled }}
  replicas: {{ .Values.agentio.agentiod.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "agentio.agentiod.selectorLabels" . | nindent 6 }}
  strategy:
    rollingUpdate:
      maxSurge: {{ .Values.agentio.agentiod.rollingUpdate.maxSurge }}
      maxUnavailable: {{ .Values.agentio.agentiod.rollingUpdate.maxUnavailable }}
  template:
    metadata:
      labels:
        {{- include "agentio.agentiod.selectorLabels" . | nindent 8 }}
        app: agentiod
        agentio.kruise.io/dataplane-mode: none
        {{- with .Values.agentio.agentiod.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "15014"
        prometheus.io/path: /metrics
        {{- with .Values.agentio.agentiod.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "agentio.agentiod.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.agentio.agentiod.securityContext | nindent 8 }}
      {{- with .Values.agentio.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      containers:
        - name: discovery
          image: {{ include "agentio.agentiod.image" . | quote }}
          imagePullPolicy: {{ .Values.agentio.global.imagePullPolicy }}
          args:
            - --discovery-address=:15012
            - --monitoring-address=:15014
            - --cluster-id={{ .Values.agentio.global.clusterId }}
            - --namespace={{ (include "agentio.namespace" .) }}
            - --domain={{ .Values.agentio.global.clusterDomain }}
            - --trust-domain={{ .Values.agentio.global.trustDomain }}
          ports:
            - name: grpc-xds
              containerPort: 15012
              protocol: TCP
            - name: http-monitoring
              containerPort: 15014
              protocol: TCP

          readinessProbe:
            httpGet:
              path: /ready
              port: 15014
            initialDelaySeconds: 1
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 15014
            periodSeconds: 10
          securityContext:
            {{- toYaml .Values.agentio.agentiod.containerSecurityContext | nindent 12 }}
          env:

            - name: AGENTIO_LOG_LEVEL
              value: {{ .Values.agentio.agentiod.logging.level | quote }}
            - name: AGENTIO_LOG_FORMAT
              value: {{ .Values.agentio.agentiod.logging.format | quote }}
            - name: AGENTIO_KEEPALIVE_MAX_SERVER_CONNECTION_AGE
              value: {{ .Values.agentio.agentiod.keepalive.maxServerConnectionAge | quote }}
            - name: AGENTIO_SERVICE_NAME
              value: {{ include "agentio.agentiod.fullname" . | quote }}
            - name: AGENTIO_TOKEN_AUDIENCE
              value: {{ .Values.agentio.agentiod.tokenAudience | quote }}
            - name: AGENTIO_CONFIGMAP_NAME
              value: {{ .Values.agentio.agentiod.config.name | quote }}
            - name: AGENTIO_PRIMARY_CONFIGMAP_NAME
              value: {{ .Values.agentio.agentiod.config.primaryName | quote }}
            - name: AGENTIO_ENABLE_DEBUG_ON_HTTP
              value: {{ .Values.agentio.agentiod.enableDebugOnHTTP | quote }}
            - name: AGENTIO_CA_SECRET_NAME
              value: {{ .Values.agentio.agentiod.ca.secretName | quote }}
            - name: AGENTIO_CA_CONFIGMAP_NAME
              value: {{ include "agentio.agentiod.caConfigMapName" . | quote }}
            - name: AGENTIO_CA_LEASE_NAME
              value: {{ .Values.agentio.agentiod.ca.leaseName | quote }}
            - name: AGENTIO_TRUST_BUNDLE_CONFIGMAP_NAME
              value: {{ .Values.agentio.agentiod.ca.trustBundleConfigMapName | quote }}
            - name: AGENTIO_TRUST_BUNDLE_LEASE_NAME
              value: {{ .Values.agentio.agentiod.ca.trustBundleLeaseName | quote }}
            - name: AGENTIO_MITM_CA_SECRET_NAME
              value: {{ .Values.agentio.agentiod.mitm.secretName | quote }}
            - name: AGENTIO_MITM_CA_SECRET_NAMESPACE
              value: {{ .Values.agentio.agentiod.mitm.secretNamespace | quote }}
            - name: AGENTIO_MITM_SIGN_MODE
              value: {{ .Values.agentio.agentiod.mitm.signMode | quote }}
            - name: AGENTIO_MESH_INTERNAL_TRAFFIC_POLICY
              value: {{ .Values.agentio.agentiod.meshInternalTrafficPolicy | quote }}
            - name: AGENTIO_ENABLE_SNI_TRAFFIC_POLICY
              value: {{ .Values.agentio.agentiod.enableSNITrafficPolicy | quote }}
            - name: AGENTIO_ENABLE_CLIENT_TRUST_DISTRIBUTOR
              value: {{ false | quote }}
            - name: AGENTIO_ENABLE_SIDECAR_INJECTOR
              value: {{ false | quote }}
            - name: AGENTIO_ENABLE_GATEWAY_DEPLOYER
              value: {{ (eq .Values.agentio.egressGateway.mode "gatewayAPI") | quote }}
            - name: AGENTIO_GATEWAY_LEASE_NAME
              value: {{ .Values.agentio.agentiod.gatewayDeployer.leaseName | quote }}
            {{- range $name, $value := .Values.agentio.agentiod.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}

          resources:
            {{- toYaml .Values.agentio.agentiod.resources | nindent 12 }}
      {{- with .Values.agentio.agentiod.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agentio.agentiod.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agentio.agentiod.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agentio.agentiod.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
