{{/* Code generated by agentio-chart-sync. DO NOT EDIT. */}}
{{- if .Values.agentio.enabled }}
{{- if eq .Values.agentio.epe.mode "managed" }}
{{- if .Values.agentio.epe.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agentio.epe.fullname" . }}
  namespace: {{ (include "agentio.namespace" .) }}
spec:
  podSelector:
    matchLabels:
      {{- include "agentio.epe.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: {{ .Values.agentio.epe.service.grpcPort }}
        - port: {{ .Values.agentio.epe.service.healthPort }}
        - port: {{ .Values.agentio.epe.service.metricsPort }}
{{- end }}
{{- end }}
{{- end }}
