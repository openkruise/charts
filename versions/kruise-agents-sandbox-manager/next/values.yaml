# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 2

e2b:
  domain: "your.domain.com"
  enableAuth: true
  adminApiKey: ""
  maxTimeout: 2592000

controller:
  repository: openkruise/sandbox-manager
  tag: v0.3.0
  pullPolicy: IfNotPresent
  logLevel: 5
  infra: sandbox-cr
  resources:
    cpu: "2"
    memory: 4Gi
  hostNetwork: false
  maxClaimWorkers: 100
  maxCreateQPS: 200
  extProcMaxConcurrency: 3000

proxy:
  repository: envoyproxy/envoy
  pullPolicy: IfNotPresent
  tag: v1.33-latest

service:
  type: ClusterIP
  port: 7788

ingress:
  className: ""
  annotations: { }
  certSecretName: sandbox-manager-tls
  dataplaneService: sandbox-gateway

imagePullSecrets: { }
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  automount: true
  annotations: { }
  name: ""

podAnnotations: { }
podLabels: { }

podSecurityContext:
  fsGroup: 2000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  capabilities:
    drop:
      - ALL
    add:
      - NET_BIND_SERVICE
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 65532

nodeSelector: { }

tolerations: [ ]

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: agents-sandbox-manager
              app.kubernetes.io/instance: agents-sandbox-manager
              component: agents-sandbox-manager
          topologyKey: kubernetes.io/hostname

gateway:
  replicaCount: 2
  image:
    repository: openkruise/sandbox-gateway
    pullPolicy: IfNotPresent
    tag: "v0.3.0"
  imagePullSecrets: [ ]
  nameOverride: ""
  serviceAccount:
    annotations: { }
    name: ""
  podAnnotations: { }
  podSecurityContext: { }
  securityContext: { }
  resources:
    cpu: "2"
    memory: 4Gi
  nodeSelector: { }
  initContainer:
    enabled: false
    image:
      repository: busybox
      tag: 1.36.1
      pullPolicy: IfNotPresent
    securityContext:
      capabilities:
        drop:
          - ALL
        add:
          - SYS_ADMIN

  tolerations: [ ]

  affinity: { }

  podAntiAffinity:
    type: "soft"
    weight: 100
    topologyKey: "kubernetes.io/hostname"

  livenessProbe:
    tcpSocket:
      port: 7788
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    tcpSocket:
      port: 7788
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

  envoy:
    admin:
      address: 127.0.0.1
      port: 9901
    listener:
      address: 0.0.0.0
      port: 7788
    logLevel: warn
    golangFilter:
      libraryId: sandbox-gateway
      libraryPath: /etc/envoy/sandbox-gateway.so
      pluginName: sandbox-gateway
    circuitBreakers:
      enabled: true
      thresholds:
        - priority: DEFAULT
          maxConnections: 32768
          maxPendingRequests: 32768
          maxRequests: 65536
          maxRetries: 5
    concurrency: ""
    drainTimeSeconds: 30
    streamIdleTimeout: "600s"
    connectTimeout: "5s"
    pluginConfig:
      hostHeaderName: Host
      sandboxHeaderName: e2b-sandbox-id
      sandboxPortHeader: e2b-sandbox-port
      defaultPort: "49983"
  service:
    type: ClusterIP
    port: 7788
    targetPort: 7788
    annotations: { }
    labels: { }

# BEGIN GENERATED AGENTIO VALUES - DO NOT EDIT
agentio:
  enabled: false

  global:
    hub: docker.io/openkruise
    trustDomain: cluster.local
    clusterId: 'Kubernetes'
    # -- CA certificate ConfigMap name. Shared by sidecar injector and ztunnel DaemonSet.
    caCertConfigMap: agentio-ca-certs
    # -- Mesh-internal traffic policy for sandbox tunnel proxies.
    # PEER_AWARE: full peer identity matching for mTLS and policy enforcement.
    # PASSTHROUGH: skip upstream discovery for in-cluster destinations.
    meshInternalTrafficPolicy: PASSTHROUGH
    # -- When true, ztunnel (both sidecar and node-level) gets NET_ADMIN + root
    # to manage iptables/nftables firewall rules.
    enableFirewallRules: true
    # -- Use the ClusterTrustBundle API instead of a ConfigMap to distribute the
    # root cert. Requires the ClusterTrustBundle API enabled in the cluster. When
    # true, agentiod publishes a ClusterTrustBundle and both injected sidecars and
    # the node-level ztunnel mount it; when false they mount the caCertConfigMap.
    enableClusterTrustBundle: false
    # -- Single identifier shared by MESH_CONFIG_MAP_NAME, INJECTOR_CONFIG_MAP_NAME,
    # LEADER_ELECTION_PREFIX, INJECTION_WEBHOOK_CONFIG_NAME and the matching ConfigMap /
    # MutatingWebhookConfiguration names. Change in one place; all references follow.
    resourcePrefix: agentio

  ztunnel:
    image:
      hub: ""
      name: ztunnel
      tag: "0.1.0"

  sidecarInjector:
    enabled: true
    ztunnel:
      # -- Firewall implementation used by injected per-pod ztunnels: auto or iptables.
      firewallBackend: auto

  agentiod:
    replicas: 1
    env: {}
    krtEventDistributeDebounce: "200ms"
    krtEventDistributeDebounceMax: "10s"
    enableTlsTermination: true
    onDemandCertSignMode: "SELF_SIGN"
    # -- Optional. When set, sets pilot RESTRICTED_SECRETS_SCOPE; when empty,
    # the env var is omitted and pilot uses its built-in default.
    restrictedSecretsScope: true
    autoscaling:
      # -- Set to false to skip rendering the HPA. When true, `replicas` above is ignored.
      enabled: false
      minReplicas: 2
      maxReplicas: 5
      targetCPUUtilizationPercentage: 80
    image:
      hub: ""
      name: pilot
      tag: "0.1.0"
    # CPU request must equal limit so HPA-based utilization is meaningful.
    resources:
      requests:
        cpu: "4"
        memory: 4Gi
      limits:
        cpu: "4"
        memory: 4Gi
    # -- Node selector for control plane pods.
    nodeSelector: { }
    # -- Tolerations for control plane pods.
    tolerations: [ ]
    # -- Affinity rules for control plane pods.
    affinity: { }

  proxy:
    image:
      hub: ""
      name: proxyv2
      tag: "0.1.0"

  # -- Lightweight image used only by the istio-init/istio-validation containers
  # to configure pod iptables. It contains pilot-agent and iptables/nftables, but
  # does not contain Envoy.
  proxyInit:
    image:
      hub: ""
      name: proxy-init
      tag: "0.1.0"

  trafficExtension:
    enabled: false
    name: traffic-extension
    port: 9002
    env: {}
    # -- Replica count when autoscaling.enabled is false. Ignored when HPA is enabled.
    replicas: 1
    # -- Identity provider endpoint used by the extension to mint sandbox tokens.
    identityProviderUrl: ""
    autoscaling:
      # -- Set to false to skip rendering the HPA.
      enabled: false
      minReplicas: 2
      maxReplicas: 50
      targetCPUUtilizationPercentage: 80
    # CPU request must equal limit so HPA-based utilization is meaningful.
    resources:
      requests:
        cpu: 2
        memory: 2Gi
      limits:
        cpu: 2
        memory: 2Gi
    image:
      hub: "docker.io/openkruise"
      name: traffic-extension
      tag: latest
    # -- PDB minAvailable for the traffic extension Deployment.
    pdbMinAvailable: 1
    # -- Node selector for traffic extension pods.
    nodeSelector: { }
    # -- Tolerations for traffic extension pods.
    tolerations: [ ]
    # -- Affinity rules for traffic extension pods.
    affinity: { }

  # -- Egress policies applied to agent traffic. Empty by default.
  egressPolicies: []

  # -- Statically chart-provisioned egress gateways — the alternative to creating
  # a Kubernetes Gateway and letting the controller provision it. Both approaches
  # produce workloads labeled networking.agents.kruise.io/sandbox-egress=true, so
  # the control plane treats them identically; use whichever fits (or both).
  # Per-gateway policy (tlsTermination, extProc, ...) is still matched from the
  # agentio-config EgressGateways list by name/namespace.
  egressGateway:
    image:
      hub: ""
      name: proxyv2
      tag: "0.1.0"
    # -- Default replicas when a gateway's autoscaling is disabled.
    replicas: 2
    # -- Default resources per gateway (overridable per gateway).
    resources:
      requests:
        cpu: "2"
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 1Gi
    # -- Default autoscaling for every gateway (overridable per gateway).
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 5
      targetCPUUtilizationPercentage: 80
    pdbMinAvailable: 1
    terminationGracePeriodSeconds: 30
    # -- Optional Envoy stats flush/eviction intervals (empty = Istio defaults).
    statsFlushInterval: ""
    statsEvictionInterval: ""
    # -- Extra env injected into every gateway proxy container.
    env: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    # -- One entry per egress gateway. Minimal form: [{ name: my-egress }].
    # Each entry may override: labels, replicas, resources, autoscaling,
    # nodeSelector, tolerations, affinity, pdbMinAvailable,
    # terminationGracePeriodSeconds, statsFlushInterval, statsEvictionInterval.
    gateways: []

  # -- Ambient mode. When enabled, deploys a node-level CNI DaemonSet and ztunnel
  # DaemonSet for ambient mesh. Independent of sidecarInjector — both can be
  # enabled simultaneously if needed.
  ambient:
    # -- Set true to deploy the CNI + ztunnel DaemonSets.
    enabled: false

    cni:
      image:
        hub: ""
        name: install-cni
        tag: "0.1.0"
      # -- Host paths for CNI binary and config installation
      cniBinDir: /opt/cni/bin
      cniConfDir: /etc/cni/net.d
      cniConfFileName: ""
      cniNetnsDir: /var/run/netns
      # -- Run install-cni in the host network namespace (hostNetwork + host DNS).
      # Upstream default is false; only enable if your ambient setup requires
      # sharing the host netns.
      shareHostNetworkNamespace: false
      # -- Deploy as chained CNI plugin (true) or standalone (false)
      chained: true
      # -- Namespaces excluded from CNI ambient redirection
      excludeNamespaces:
        - kube-system
      # -- Enablement selector for ambient mode. Pods/namespaces matching
      # these selectors will be enrolled into the ambient mesh.
      enablementSelector:
        # Pod-level: enrolled when the pod itself carries the label
        - podSelector:
            matchLabels:
              istio.io/dataplane-mode: ambient
        # Namespace-level: namespace has the label and the pod has not explicitly opted out
        - podSelector:
            matchExpressions:
              - key: istio.io/dataplane-mode
                operator: NotIn
                values: [none]
          namespaceSelector:
            matchLabels:
              istio.io/dataplane-mode: ambient
      # -- DNS capture for ambient pods
      dnsCapture: true
      # -- IPv6 support
      ipv6: true
      # -- Reconcile iptables rules at startup
      reconcileIptablesOnStartup: true
      # -- Pod repair settings
      repair:
        enabled: true
        repairPods: true
        labelPods: false
        deletePods: false
        initContainerName: "istio-validation"
        brokenPodLabelKey: "cni.istio.io/uninitialized"
        brokenPodLabelValue: "true"
      resources:
        requests:
          cpu: 100m
          memory: 100Mi
      tolerations:
        - effect: NoSchedule
          operator: Exists
        - key: CriticalAddonsOnly
          operator: Exists
        - effect: NoExecute
          operator: Exists
      updateStrategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 1
      terminationGracePeriodSeconds: 30

    ztunnel:
      logLevel: info
      # -- Output ztunnel logs in JSON format.
      logAsJson: true
      # -- Extra environment variables as key-value pairs injected into the ztunnel container.
      env: {}
      resources:
        requests:
          cpu: 1
          memory: 1024Mi
      tolerations:
        - effect: NoSchedule
          operator: Exists
        - key: CriticalAddonsOnly
          operator: Exists
        - effect: NoExecute
          operator: Exists
      terminationGracePeriodSeconds: 30
      updateStrategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 1
          maxUnavailable: 0

  # -- Raw overrides merged on top of the built-in agentio-config ConfigMap body.
  # Use this to set fields the chart does not model explicitly (e.g. clusterSettings)
  # or to override defaults. Maps deep-merge; lists are replaced wholesale.
  agentioConfig: { }
# END GENERATED AGENTIO VALUES
