# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 2

# Registry prepended to every image configured in this chart. Each component
# keeps its own repository/tag keys (controller, proxy, gateway, agentio); an
# image that sets its own registry overrides this one, and an empty registry
# inherits it. The prefix is skipped for a repository whose first path segment
# already names a host, so myreg.io/openkruise/sandbox-manager still works.
image:
  registry: docker.io

e2b:
  domain: "your.domain.com"
  extraDomains: []
  enableAuth: true
  adminApiKey: ""
  maxTimeout: 2592000
  keyStorage:
    # "secret" stores E2B API keys in the e2b-key-store Secret. "mysql" is also
    # supported, but requires a non-empty dsn and hashPepper: the manager
    # validates them at startup and exits if either is blank.
    mode: secret
    mysql:
      dsn: ""
      hashPepper: ""

quota:
  enabled: false
  redis:
    addr: ""
    db: 0
    username: ""
    password: ""

controller:
  repository: openkruise/sandbox-manager
  tag: v0.3.0
  pullPolicy: IfNotPresent
  logLevel: 5
  infra: sandbox-cr
  resources:
    cpu: "2"
    memory: 4Gi
  hostNetwork: false
  maxClaimWorkers: 100
  maxCreateQPS: 200
  extProcMaxConcurrency: 10000

proxy:
  repository: envoyproxy/envoy
  pullPolicy: IfNotPresent
  tag: v1.33-latest

service:
  type: ClusterIP
  port: 7788

ingress:
  className: ""
  annotations: { }
  certSecretName: sandbox-manager-tls
  dataplaneService: sandbox-gateway

prometheus:
  enabled: false

imagePullSecrets: { }
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  automount: true
  annotations: { }
  name: ""

podAnnotations: { }
podLabels: { }

podSecurityContext:
  fsGroup: 2000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  capabilities:
    drop:
      - ALL
    add:
      - NET_BIND_SERVICE
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 65532

nodeSelector: { }

tolerations: [ ]

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: agents-sandbox-manager
              app.kubernetes.io/instance: agents-sandbox-manager
              component: agents-sandbox-manager
          topologyKey: kubernetes.io/hostname

gracefulShutdown:
  preStopSleepSeconds: 0

gateway:
  replicaCount: 2
  image:
    repository: openkruise/sandbox-gateway
    pullPolicy: IfNotPresent
    tag: "v0.3.0"
  imagePullSecrets: [ ]
  nameOverride: ""
  serviceAccount:
    annotations: { }
    name: ""
  podAnnotations: { }
  podSecurityContext: { }
  securityContext: { }
  resources:
    cpu: "2"
    memory: 4Gi
  nodeSelector: { }
  initContainer:
    enabled: false
    image:
      repository: busybox
      tag: 1.36.1
      pullPolicy: IfNotPresent
    securityContext:
      capabilities:
        drop:
          - ALL
        add:
          - SYS_ADMIN

  tolerations: [ ]

  affinity: { }

  podAntiAffinity:
    type: "soft"
    weight: 100
    topologyKey: "kubernetes.io/hostname"

  livenessProbe:
    tcpSocket:
      port: 7788
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    tcpSocket:
      port: 7788
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

  envoy:
    admin:
      address: 127.0.0.1
      port: 9901
    # -- Prometheus metrics endpoint (exposed externally; proxies to admin /stats/prometheus)
    prometheus:
      enabled: false
      address: 0.0.0.0
      port: 9902
      path: /metrics
    listener:
      address: 0.0.0.0
      port: 7788
    logLevel: warn
    golangFilter:
      libraryId: sandbox-gateway
      libraryPath: /etc/envoy/sandbox-gateway.so
      pluginName: sandbox-gateway
    circuitBreakers:
      enabled: true
      maxConnections: 80000
      maxPendingRequests: 32768
      maxRequests: 80000
      maxRetries: 5
    concurrency: ""
    drainTimeSeconds: 30
    streamIdleTimeout: "600s"
    connectTimeout: "5s"
    useDownstreamProtocolConfig: false
    perConnectionBufferLimitBytes: 1048576
    tcpKeepalive:
      enabled: false
      keepaliveProbes: 3
      keepaliveTime: 60
      keepaliveInterval: 10
    pluginConfig:
      hostHeaderName: Host
      sandboxHeaderName: e2b-sandbox-id
      sandboxPortHeader: e2b-sandbox-port
      defaultPort: "49983"
      enableAuth: true
      trafficAccessTokenHeader: e2b-traffic-access-token
      enableJwtAuth: false
  service:
    type: ClusterIP
    port: 7788
    targetPort: 7788
    annotations: { }
    labels: { }

