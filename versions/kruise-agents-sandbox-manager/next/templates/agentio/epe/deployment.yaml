{{/* Code generated by agentio-chart-sync. DO NOT EDIT. */}}
{{- if .Values.agentio.enabled }}
{{- if eq .Values.agentio.epe.mode "managed" }}
{{- include "agentio.validate" . }}
{{- $source := .Values.agentio.epe.credentialProvider.mtls.source }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentio.epe.fullname" . }}
  namespace: {{ (include "agentio.namespace" .) }}
  labels:
    {{- include "agentio.epe.labels" . | nindent 4 }}
spec:
  {{- if not .Values.agentio.epe.autoscaling.enabled }}
  replicas: {{ .Values.agentio.epe.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "agentio.epe.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agentio.epe.selectorLabels" . | nindent 8 }}
        agentio.kruise.io/dataplane-mode: none
        {{- with .Values.agentio.epe.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        {{- with .Values.agentio.epe.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "agentio.epe.serviceAccountName" . }}
      {{- with .Values.agentio.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: epe
          image: {{ include "agentio.epe.image" . | quote }}
          imagePullPolicy: {{ .Values.agentio.global.imagePullPolicy }}
          args:
            - -grpc-port={{ .Values.agentio.epe.service.grpcPort }}
            - -grpc-health-port={{ .Values.agentio.epe.service.healthPort }}
            - -metrics-port={{ .Values.agentio.epe.service.metricsPort }}
            - -audit-webhook-insecure-skip-verify={{ .Values.agentio.epe.auditWebhook.insecureSkipVerify }}
          env:
            - name: IDENTITY_PROVIDER_URL
              value: {{ .Values.agentio.epe.credentialProvider.url | quote }}
            - name: TOKEN_CACHE_TTL
              value: {{ .Values.agentio.epe.tokenCacheTTL | quote }}
            - name: TOKEN_CACHE_MAX_SIZE
              value: {{ .Values.agentio.epe.tokenCacheMaxSize | quote }}
            - name: CREDENTIAL_PROVIDER_MTLS_SOURCE
              value: {{ $source | quote }}
            {{- if eq $source "secret" }}
            - name: CREDENTIAL_PROVIDER_SECRET_NAMESPACE
              value: {{ .Values.agentio.epe.credentialProvider.mtls.secret.namespace | quote }}
            - name: CREDENTIAL_PROVIDER_SECRET_NAME
              value: {{ .Values.agentio.epe.credentialProvider.mtls.secret.name | quote }}
            {{- end }}
            {{- if .Values.agentio.epe.credentialProvider.mtls.insecureSkipVerify }}
            - name: CREDENTIAL_PROVIDER_INSECURE_SKIP_VERIFY
              value: "true"
            {{- end }}
            {{- range $name, $value := .Values.agentio.epe.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          ports:
            - {name: extproc, containerPort: {{ .Values.agentio.epe.service.grpcPort }}}
            - {name: health, containerPort: {{ .Values.agentio.epe.service.healthPort }}}
            - {name: metrics, containerPort: {{ .Values.agentio.epe.service.metricsPort }}}
          livenessProbe:
            grpc: {port: {{ .Values.agentio.epe.service.healthPort }}}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            grpc: {port: {{ .Values.agentio.epe.service.healthPort }}}
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.agentio.epe.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
            runAsUser: 65532
            runAsGroup: 65532
            runAsNonRoot: true
          {{- if eq $source "files" }}
          volumeMounts:
            - name: credential-provider-mtls
              mountPath: /etc/epe/credential-provider
              readOnly: true
          {{- end }}
      {{- if eq $source "files" }}
      volumes:
        - name: credential-provider-mtls
          secret:
            secretName: {{ include "agentio.epe.mtlsSecretName" . }}
            optional: true
      {{- end }}
      {{- with .Values.agentio.epe.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agentio.epe.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agentio.epe.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agentio.epe.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
