{{/* Code generated by agentio-chart-sync. DO NOT EDIT. */}}
{{- if .Values.agentio.enabled }}
{{- if eq .Values.agentio.epe.mode "managed" }}
{{- if .Values.agentio.epe.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "agentio.epe.fullname" . }}
  namespace: {{ (include "agentio.namespace" .) }}
  labels:
    {{- include "agentio.epe.labels" . | nindent 4 }}
spec:
  minReplicas: {{ .Values.agentio.epe.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.agentio.epe.autoscaling.maxReplicas }}
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: {{ include "agentio.epe.fullname" . }}}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: {{ .Values.agentio.epe.autoscaling.targetCPUUtilizationPercentage }}}
{{- end }}
{{- end }}
{{- end }}
