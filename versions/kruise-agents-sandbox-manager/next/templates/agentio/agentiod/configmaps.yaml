{{/* Code generated by agentio-chart-sync. DO NOT EDIT. */}}
{{- if .Values.agentio.enabled }}
{{- $defaults := dict -}}
{{- if eq .Values.agentio.egressGateway.mode "static" -}}
{{- $gateway := dict "name" (include "agentio.gateway.fullname" .) "namespace" (include "agentio.namespace" .) -}}
{{- $_ := set $defaults "egressGateways" (list $gateway) -}}
{{- end -}}
{{- if ne .Values.agentio.epe.mode "disabled" -}}
{{- $request := dict "headerMode" "SEND" "attributes" (list "filter_state['sandbox.id']" "filter_state['sandbox.token']" "filter_state['sandbox.labels']" "filter_state['agentio.workload.name']" "filter_state['agentio.workload.namespace']" "filter_state['downstream_peer'].name" "filter_state['downstream_peer'].namespace" "destination.port" "source.address") -}}
{{- $response := dict "headerMode" "SKIP" -}}
{{- $provider := dict "service" (include "agentio.epeService" .) "port" (include "agentio.epePort" . | int) "messageTimeout" .Values.agentio.epe.messageTimeout "request" $request "response" $response -}}
{{- $_ := set $defaults "sandboxExtProc" $provider -}}
{{- end -}}
{{/* BEGIN INTEGRATION EGRESS DEFAULT */}}
{{- if and (eq .Values.agentio.egressGateway.mode "static") (not (hasKey (.Values.agentio.agentiod.config.values | default dict) "egressPolicies")) -}}
{{- $service := printf "%s.%s.svc.%s" (include "agentio.gateway.fullname" .) (include "agentio.namespace" .) .Values.agentio.global.clusterDomain -}}
{{- $_ := set $defaults "egressPolicies" (list (dict "policy" "GATEWAY" "gateway" (dict "service" $service))) -}}
{{- end -}}
{{/* END INTEGRATION EGRESS DEFAULT */}}
{{- $config := mergeOverwrite (deepCopy $defaults) (.Values.agentio.agentiod.config.values | default dict) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.agentio.agentiod.config.name }}
  namespace: {{ (include "agentio.namespace" .) }}
  labels:
    {{- include "agentio.agentiod.labels" . | nindent 4 }}
data:
  config: |
    {{- toYaml $config | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.agentio.agentiod.config.sourcesName }}
  namespace: {{ (include "agentio.namespace" .) }}
  labels:
    manifests.agents.kruise.io/kube-source: "true"
    {{- include "agentio.agentiod.labels" . | nindent 4 }}
data:
  sources: |
    {{- .Values.agentio.agentiod.config.sources | nindent 4 }}
{{- end }}
