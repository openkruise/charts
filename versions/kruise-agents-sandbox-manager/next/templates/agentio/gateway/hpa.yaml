{{/* Code generated by agentio-chart-sync. DO NOT EDIT. */}}
{{- if .Values.agentio.enabled }}
{{- if eq .Values.agentio.egressGateway.mode "static" }}
{{- if .Values.agentio.egressGateway.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "agentio.gateway.fullname" . }}
  namespace: {{ (include "agentio.namespace" .) }}
  labels:
    {{- include "agentio.gateway.labels" . | nindent 4 }}
spec:
  minReplicas: {{ .Values.agentio.egressGateway.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.agentio.egressGateway.autoscaling.maxReplicas }}
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: {{ include "agentio.gateway.fullname" . }}}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: {{ .Values.agentio.egressGateway.autoscaling.targetCPUUtilizationPercentage }}}
{{- end }}
{{- end }}
{{- end }}
