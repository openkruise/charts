    {{- include "agentio.controller.labels" . | nindent 4 }}
  name: {{ include "agentio.controller.name" . }}-clusterrole
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "agentio.controller.name" . }}-clusterrole
subjects:
- kind: ServiceAccount
  name: {{ include "agentio.controller.name" . }}
  namespace: {{ include "agentio.namespace" . }}
{{- end }}
