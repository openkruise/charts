# Kubernetes Gateway API: read Gateways/routes and write their status.
- apiGroups:
  - gateway.networking.k8s.io
  - gateway.networking.x-k8s.io
  resources:
  - '*'
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - gateway.networking.k8s.io
  resources:
  - backendtlspolicies/status
  - gatewayclasses/status
  - gateways/status
  - grpcroutes/status
  - httproutes/status
  - referencegrants/status
  - tcproutes/status
  - tlsroutes/status
  - udproutes/status
  verbs:
  - update
  - patch
- apiGroups:
  - gateway.networking.x-k8s.io
  resources:
  - xbackendtrafficpolicies/status
  - xlistenersets/status
  verbs:
  - update
  - patch
- apiGroups:
  - gateway.networking.k8s.io
  resources:
  - gatewayclasses
  verbs:
  - create
  - update
  - patch
  - delete
# Gateway/waypoint deployment controller: manage the injected Deployment,
