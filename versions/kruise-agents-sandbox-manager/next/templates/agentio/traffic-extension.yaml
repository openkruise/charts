          image: {{ include "agentio.image" (dict "hub" .Values.agentio.trafficExtension.image.hub "name" .Values.agentio.trafficExtension.image.name "tag" .Values.agentio.trafficExtension.image.tag "globalHub" .Values.agentio.global.hub) }}
