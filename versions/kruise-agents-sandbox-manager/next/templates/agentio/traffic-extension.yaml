            - -metrics-port=9090
          env:
            - name: IDENTITY_PROVIDER_URL
              value: {{ .Values.agentio.trafficExtension.identityProviderUrl | quote }}
            - name: DEFAULT_SANDBOX_TOKEN
              valueFrom:
                secretKeyRef:
