{{- if .Values.agentio.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    {{- include "agentio.controller.labels" . | nindent 4 }}
  name: {{ include "agentio.controller.name" . }}
  namespace: {{ include "agentio.namespace" . }}
spec:
  {{- if not .Values.agentio.agentiod.autoscaling.enabled }}
  replicas: {{ .Values.agentio.agentiod.replicas | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ include "agentio.controller.name" . }}
  strategy:
    rollingUpdate:
      maxSurge: 100%
      maxUnavailable: 25%
  template:
    metadata:
      annotations:
        prometheus.io/port: "15014"
        prometheus.io/scrape: "true"
      labels:
        app: {{ include "agentio.controller.name" . }}
    spec:
      containers:
      - args:
        - discovery
        - --monitoringAddr=:15014
        - --log_output_level=default:info
        - --domain
        - {{ .Values.agentio.global.trustDomain }}
        - --keepaliveMaxServerConnectionAge
        - 30m
