          readOnlyRootFilesystem: true
          runAsNonRoot: true
        volumeMounts:
        - mountPath: /var/run/secrets/tokens
          name: istio-token
          readOnly: true
        - mountPath: /var/run/secrets/istio-dns
          name: local-certs
      serviceAccountName: {{ include "agentio.controller.name" . }}
      {{- with .Values.agentio.agentiod.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agentio.agentiod.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agentio.agentiod.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
      - emptyDir:
          medium: Memory
        name: local-certs
      - name: istio-token
        projected:
          sources:
          - serviceAccountToken:
              audience: istio-ca
              expirationSeconds: 43200
              path: istio-token
---
apiVersion: v1
kind: Service
metadata:
  labels:
    {{- include "agentio.controller.labels" . | nindent 4 }}
  name: {{ include "agentio.controller.name" . }}
  namespace: {{ include "agentio.namespace" . }}
spec:
  ports:
  - name: grpc-xds
    port: 15010
    protocol: TCP
  - name: https-dns
    port: 15012
    protocol: TCP
  - name: http-monitoring
    port: 15014
    protocol: TCP
  selector:
    app: {{ include "agentio.controller.name" . }}
{{- if .Values.agentio.agentiod.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "agentio.controller.name" . }}
  namespace: {{ include "agentio.namespace" . }}
  labels:
    {{- include "agentio.controller.labels" . | nindent 4 }}
spec:
  maxReplicas: {{ .Values.agentio.agentiod.autoscaling.maxReplicas | default 5 }}
  minReplicas: {{ .Values.agentio.agentiod.autoscaling.minReplicas | default 2 }}
  scaleTargetRef:
    apiVersion: apps/v1
