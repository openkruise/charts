            fieldRef:
              apiVersion: v1
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        - name: SERVICE_ACCOUNT
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: spec.serviceAccountName
        - name: KUBECONFIG
          value: /var/run/secrets/remote/config
        - name: PILOT_ENABLE_AMBIENT
          value: "true"
        - name: PILOT_TRACE_SAMPLING
          value: "1"
        - name: PILOT_ENABLE_ANALYSIS
          value: "false"
        - name: CLUSTER_ID
          value: "{{ .Values.agentio.global.clusterId }}"
        - name: GOMAXPROCS
          valueFrom:
            resourceFieldRef:
              divisor: "1"
              resource: limits.cpu

        - name: MESH_CONFIG_MAP_NAME
          value: {{ .Values.agentio.global.resourcePrefix | quote }}
        - name: LEADER_ELECTION_PREFIX
          value: {{ .Values.agentio.global.resourcePrefix | quote }}
        {{- if .Values.agentio.agentiod.onDemandCertSignMode }}
        - name: ON_DEMAND_SIGN_MODE
          value: {{ .Values.agentio.agentiod.onDemandCertSignMode | quote }}
        {{- end }}
        {{- if .Values.agentio.agentiod.restrictedSecretsScope }}
        - name: RESTRICTED_SECRETS_SCOPE
          value: {{ include "agentio.namespace" . }}
        {{- end }}
        - name: PILOT_HTTP10
          value: "true"
        - name: ENABLE_ON_DEMAND_CERTS
          value: "{{ .Values.agentio.agentiod.enableTlsTermination }}"
        {{- if .Values.agentio.sniTrafficPolicy.enabled }}
        - name: ENABLE_SNI_TRAFFIC_POLICY
          value: "true"
        {{- end }}
        - name: PILOT_ENABLE_IP_AUTOALLOCATE
          value: "false"
        - name: MESH_INTERNAL_TRAFFIC_POLICY
          value: {{ .Values.agentio.global.meshInternalTrafficPolicy | default "PEER_AWARE" | quote }}
        - name: AMBIENT_ENABLE_MULTI_NETWORK_WAYPOINT
          value: "false"
        - name: INJECT_ENABLED
          value: "false"
        - name: AMBIENT_ENABLE_STATUS
          value: "false"
        - name: PILOT_CA_CERT_CONFIGMAP
          value: {{ include "agentio.caCertConfigMap" . }}
        - name: PILOT_IGNORE_RESOURCES
          value: "*."
        - name: PILOT_INCLUDE_RESOURCES
          value: "*.kruise.io,*.gateway.networking.k8s.io"
        - name: ISTIOD_CUSTOM_HOST
          value: {{ include "agentio.controller.name" . }}.{{ include "agentio.namespace" . }}.svc,{{ include "agentio.controller.name" . }}.{{ include "agentio.namespace" . }}.svc.cluster.local
        {{- if .Values.agentio.agentiod.krtEventDistributeDebounce }}
        - name: KRT_EVENT_DISTRIBUTE_DEBOUNCE
          value: {{ .Values.agentio.agentiod.krtEventDistributeDebounce | quote }}
        {{- end }}
        {{- if .Values.agentio.agentiod.krtEventDistributeDebounceMax }}
        - name: KRT_EVENT_DISTRIBUTE_DEBOUNCE_MAX
          value: {{ .Values.agentio.agentiod.krtEventDistributeDebounceMax | quote }}
        {{- end }}
        {{- range $key, $val := .Values.agentio.agentiod.env }}
        - name: {{ $key }}
          value: {{ $val | quote }}
        {{- end }}
        image: {{ include "agentio.image" (dict "hub" .Values.agentio.agentiod.image.hub "name" .Values.agentio.agentiod.image.name "tag" .Values.agentio.agentiod.image.tag "globalHub" .Values.agentio.global.hub) }}
        name: discovery
        ports:
        - containerPort: 8080
          name: http-debug
          protocol: TCP
        - containerPort: 15010
          name: grpc-xds
          protocol: TCP
        - containerPort: 15012
          name: tls-xds
          protocol: TCP
        - containerPort: 15014
          name: http-monitoring
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 1
          periodSeconds: 3
          timeoutSeconds: 5
        resources:
          {{- if .Values.agentio.agentiod.resources }}
          {{- toYaml .Values.agentio.agentiod.resources | nindent 10 }}
          {{- else }}
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            cpu: 500m
            memory: 2Gi
          {{- end }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
