    name: {{ include "agentio.controller.name" . }}
  metrics:
  {{- if .Values.agentio.agentiod.autoscaling.targetCPUUtilizationPercentage }}
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{ .Values.agentio.agentiod.autoscaling.targetCPUUtilizationPercentage }}
  {{- end }}
  {{- if .Values.agentio.agentiod.autoscaling.targetMemoryUtilizationPercentage }}
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: {{ .Values.agentio.agentiod.autoscaling.targetMemoryUtilizationPercentage }}
  {{- end }}
  {{- if .Values.agentio.agentiod.autoscaling.behavior }}
  behavior:
    {{- toYaml .Values.agentio.agentiod.autoscaling.behavior | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
