{{- $domains := concat (list .Values.e2b.domain) (default (list) .Values.e2b.extraDomains) | compact | uniq }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "sandbox-manager.fullname" . }}
  labels:
    {{- include "sandbox-manager.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80},{"HTTPS": 443}]'
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  tls:
    - hosts:
        {{- range $domains }}
        - "api.{{ . }}"
        - "*.{{ . }}"
        - "{{ . }}"
        {{- end }}
      secretName: "{{ .Values.ingress.certSecretName }}"
  rules:
    {{- range $domains }}
    # Control Plane
    - host: 'api.{{ . }}'
      http:
        paths:
          - backend:
              service:
                name: {{ include "sandbox-manager.fullname" $ }}
                port:
                  number: 7788
            path: /
            pathType: Prefix
    # Data Plane
    - host: '*.{{ . }}'
      http:
        paths:
          - backend:
              service:
                name: {{ $.Values.ingress.dataplaneService }}
                port:
                  number: 7788
            path: /
            pathType: Prefix
    - host: '{{ . }}'
      http:
        paths:
          - backend:
              service:
                name: {{ include "sandbox-manager.fullname" $ }}
                port:
                  number: 7788
            path: /kruise/api
            pathType: Prefix
          - backend:
              service:
                name: {{ $.Values.ingress.dataplaneService }}
                port:
                  number: 7788
            path: /
            pathType: Prefix
    {{- end }}
