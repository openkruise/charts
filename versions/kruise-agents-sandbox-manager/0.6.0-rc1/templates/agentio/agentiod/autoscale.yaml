{{/* Code generated by agentio-chart-sync. DO NOT EDIT. */}}
{{- if .Values.agentio.enabled }}
{{- if .Values.agentio.agentiod.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "agentio.agentiod.fullname" . }}
  namespace: {{ (include "agentio.namespace" .) }}
  labels:
    {{- include "agentio.agentiod.labels" . | nindent 4 }}
spec:
  minReplicas: {{ .Values.agentio.agentiod.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.agentio.agentiod.autoscaling.maxReplicas }}
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "agentio.agentiod.fullname" . }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.agentio.agentiod.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}
