{{- if .Values.agentio.enabled }}
{{- if eq .Values.agentio.egressGateway.mode "static" }}
{{- if .Values.agentio.egressGateway.rbac.readSecrets }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "agentio.gateway.fullname" . }}
  namespace: {{ (include "agentio.namespace" .) }}
  labels:
    {{- include "agentio.gateway.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "agentio.gateway.fullname" . }}
  namespace: {{ (include "agentio.namespace" .) }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "agentio.gateway.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "agentio.gateway.serviceAccountName" . }}
    namespace: {{ (include "agentio.namespace" .) }}
{{- end }}
{{- end }}
{{- end }}
