# Default values for kruise-game.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# values for kruise-game installation
installation:
  namespace: kruise-game-system
  createNamespace: true

kruiseGame:
  fullname: kruise-game-controller-manager
  healthBindPort: "8082"
  webhook:
    port: 443
    targetPort: 9876
  apiServerQps: 5
  apiServerQpsBurst: 10
  # node selector for the controller-manager Pod
  nodeSelector: {}
  # tolerations for the controller-manager Pod
  tolerations: []
  # affinity rules for the controller-manager Pod
  # for example, to spread replicas across different nodes:
  # affinity:
  #   podAntiAffinity:
  #     preferredDuringSchedulingIgnoredDuringExecution:
  #       - podAffinityTerm:
  #           labelSelector:
  #             matchExpressions:
  #               - key: control-plane
  #                 operator: In
  #                 values:
  #                   - kruise-game-controller-manager
  #           topologyKey: kubernetes.io/hostname
  #         weight: 100
  affinity: {}

# imagePullSecrets to pull the controller-manager image
imagePullSecrets: []
#  - name: my-registry-secret

replicaCount: 1

image:
  repository: openkruise/kruise-game-manager
  tag: v0.9.0
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.

serviceAccount:
  # Annotations to add to the service account
  annotations: {}

service:
  port: 8443

resources:
  limits:
    cpu: 500m
    memory: 1024Mi
  requests:
    cpu: 10m
    memory: 64Mi
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

prometheus:
  enabled: false
  monitorService:
    port: 8080
scale:
  service:
    port: 6000
    targetPort: 6000

network:
  totalWaitTime: 60
  probeIntervalTime: 5

cloudProvider:
  installCRD: true